services:
  redis:
    image: redis:7
    container_name: workspace-redis
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - workspace-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: workspace-mailhog
    ports:
      - '1025:1025'  # SMTP server
      - '8025:8025'  # Web interface
    networks:
      - workspace-network

  mongo:
    image: mongo:7
    container_name: workspace-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - workspace-network

  postgres:
    image: postgres:latest
    container_name: workspace-postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ./.env.api
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d workspace_dev']
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - workspace-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.API
      target: runner
    container_name: workspace-api-dev
    ports:
      - '3000:3000'
    env_file:
      - ../apps/api/.env
      - ./.env.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - workspace-network

  workers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.Workers
      target: runner
    container_name: workspace-workers-dev
    env_file:
      - ../apps/worker/.env
      - ./.env.api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - workspace-network

volumes:
  postgres-data:
  mongo-data:

networks:
  workspace-network:
    external: true
