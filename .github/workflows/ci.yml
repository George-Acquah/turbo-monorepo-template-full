name: CI

on:
  pull_request:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which areas changed ────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.filter.outputs.backends }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backends:
              - 'packages/server/**'
              - 'apps/api/**'
              - 'apps/worker/**'
            web:
              - 'apps/landing/**'
              - 'apps/backoffice/**'
              - 'apps/members/**'
              - 'packages/client/**'

  # ─── Lint + Type Check + Tests (always runs) ───────────────────────────────
  quality:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ESLint config
        run: pnpm --filter=@workspace/eslint run build

      - name: Set CI DATABASE_URL
        run: echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy?schema=public" >> $GITHUB_ENV

      - name: Prisma generate
        run: pnpm --filter=@workspace/prisma run prisma:generate

      - name: Build shared packages
        run: pnpm turbo run build --filter=!@workspace/landing --filter=!@workspace/backoffice --filter=!@workspace/members --filter=!@workspace/api --filter=!@workspace/worker

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run check-types

      - name: Unit Tests
        run: pnpm -r --if-present run test:cov

  # ─── Build Backend Docker Images (only when api/worker/server packages change) ─
  # Lint/type-check/test for apps/api and apps/worker already run above as part of
  # `quality` — the root `lint`/`check-types` scripts and `pnpm -r` test call are
  # unfiltered, so they already cover every workspace package including these two.
  # What's missing without this job is validating the actual deploy artifact: this
  # builds both Dockerfiles (no push) so a broken `docker/Dockerfile.API` or
  # `Dockerfile.Workers` fails a PR instead of failing at deploy time.
  build-backends:
    name: Build Backend Docker Images
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backends == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build apps/api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.API
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build apps/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.Workers
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  # ─── Build Web (only when frontend files change) ───────────────────────────
  build-web:
    name: Build Workspace Client Apps
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-web-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Landing App
        run: pnpm run build:landing

      - name: Build Backoffice App
        run: pnpm run build:backoffice

      - name: Build Members App
        run: pnpm run build:members
